# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# @n8n/node-cli ≥ 0.23.0 is required. Earlier versions do not support the
# provenance flag passed by `npm run release` in CI, and the publish step will
# fail. Check the version installed in this project with:
#
#   npm list @n8n/node-cli
#
# To upgrade:
#
#   npm install --save-dev @n8n/node-cli@latest
#
# ─── HOW THIS PACKAGE PUBLISHES ────────────────────────────────────────────────
#
# npm Trusted Publishing (OIDC), set up on npmjs.com on 2026-11-24 for
# codynaut/n8n-nodes-pagedpdf, workflow publish.yml, no environment. There is
# no npm token anywhere: GitHub's OIDC token authenticates each run.
#
# The trusted publisher is allowed to STAGE releases only (npm's recommended
# setting), so this workflow runs `npm stage publish`. Each version then waits
# under Staged Packages on npmjs.com until the maintainer approves it with 2FA.
# A plain `npm publish` from here is refused with "OIDC permission denied".
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# This workflow triggers on tags matching "*.*.*" (e.g. 0.2.0).
# If you prefer tags with a "v" prefix (e.g. v0.2.0), change the filter to:
#   tags: ['v*.*.*']
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Bump the version in package.json and CHANGELOG.md, commit, then push a tag
# with the same version (for example 0.1.2). This workflow lints, builds and
# stages that version on npm. Approve it on npmjs.com to publish it.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      # See "TAG CONVENTION" above if you prefer tags with a "v" prefix.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release
        # The same steps `n8n-node release` runs in CI (lint, build, publish with
        # provenance), except the last one stages the version instead of publishing
        # it, because the trusted publisher only allows staging. RELEASE_MODE lets the
        # package's prepublishOnly guard (`n8n-node prerelease`) through.
        run: |
          npm --version
          npm run lint
          npm run build
          npm stage publish
        env:
          RELEASE_MODE: 'true'
          NPM_CONFIG_PROVENANCE: 'true'
